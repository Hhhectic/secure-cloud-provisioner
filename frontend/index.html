<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sanctum — provision &amp; audit</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="head-inner">
    <div class="brand">
      <h1 class="wordmark">Sanctum</h1>
      <div class="tagline">provision &amp; audit</div>
    </div>
    <div class="head-right">
      <span id="health" class="pill">checking…</span>
      <!-- Two clouds, one at a time. Fourteen resource types in a single row
           wrapped onto two lines and mixed the two accounts together, which
           makes "which cloud am I about to delete in" a question answered by
           reading a tab label. -->
      <button id="cloud-toggle" class="toggle" title="Switch cloud">
        <span class="knob"></span>
        <span class="opt" data-cloud="aws"><span class="dot"></span>AWS</span>
        <span class="opt" data-cloud="azure"><span class="dot"></span>Azure</span>
      </button>
    </div>
  </div>
</header>

<div class="drift" aria-hidden="true"><i></i><i></i><i></i></div>

<!-- Three things a person comes here to do, rather than fourteen nouns.
     "Resources" was one list mixing the form you fill in to make something
     with the list you read to find out what is wrong with it, and those are
     different jobs done at different times. -->
<nav id="tabs" class="tabs" role="tablist">
  <button class="tab" data-tab="dashboard" role="tab">Dashboard</button>
  <button class="tab" data-tab="create" role="tab">Create</button>
  <button class="tab" data-tab="audit" role="tab">Audit</button>
</nav>

<div class="context">
  <label id="scope-box"></label>
  <p id="scope-note"></p>
</div>

<main>
  <aside id="sidebar">
    <div class="side-head" id="side-head">Resources</div>
    <nav id="types"></nav>
    <div id="side-foot"></div>
  </aside>

  <div class="stack">
    <section id="dashboard" class="hidden">
      <div class="card-head">
        <h2>Dashboard</h2>
        <span class="controls">
          <button id="scan-all" class="quiet">Scan everything</button>
          <button id="dash-refresh" class="quiet">Refresh</button>
        </span>
      </div>
      <div id="dash-body"></div>
    </section>

    <section id="listing">
      <div class="card-head">
        <h2 id="listing-title">Resources</h2>
        <span class="controls">
          <span id="audit-badge" class="audit-badge hidden">audit only</span>
          <!-- Two checkboxes stood here and both have gone.
               "scan each (slow)" moved to the Dashboard: starting a scan and
               reading its answers are different acts, and a box that silently
               made opening a list take a minute was the wrong place for the
               first of them.
               "only ones this tool made" was on by default, which meant this
               tab quietly answered a narrower question than the Dashboard
               beside it - the counts there have always been every resource -
               so the same account read as two different accounts depending on
               which tab you were looking at. An audit that hides what it did
               not create is the wrong default for a tool whose whole job is
               finding what is wrong in an account. -->
          <button id="refresh" class="quiet">Refresh</button>
        </span>
      </div>
      <div id="list"></div>
      <div id="cleanup-box"></div>
    </section>

    <!-- Create sits above Detail on purpose. Detail is the tallest thing on
         the page by a distance - every finding at full length, then the
         resource's whole settings block - so with it in between, reaching the
         form meant scrolling past all of that. Create is also the panel you
         come to the page intending to use, where Detail is a response to
         having clicked a row. -->
    <section id="create">
      <button id="create-fold" class="fold" aria-expanded="true">
        <span class="fold-left">
          <span style="font:600 15px/1.3 var(--sans)">Create</span>
          <span id="create-sub" class="sub"></span>
        </span>
        <span class="fold-right">
          <span id="create-hint" class="sub"></span>
          <span class="chev"></span>
        </span>
      </button>
      <div id="create-body" class="fold-body"></div>
    </section>

    <section id="detail">
      <div class="card-head">
        <h2>Detail</h2>
        <span id="detail-id" class="muted"></span>
      </div>
      <div id="detail-body" class="muted">Pick something from the list.</div>
    </section>

    <section id="blueprint" class="hidden">
      <h2>Blueprint: bastion architecture</h2>
      <div id="blueprint-body"></div>
    </section>
  </div>
</main>

<div id="modal" class="hidden">
  <div class="sheet">
    <h2 id="modal-title">Confirm</h2>
    <div id="modal-body"></div>
    <div class="row">
      <button id="modal-cancel">Cancel</button>
      <button id="modal-go" class="danger" disabled>Delete</button>
    </div>
  </div>
</div>

<div id="toast" class="hidden"></div>

<script src="keygen.js"></script>
<script src="app.js"></script>
</body>
</html>
