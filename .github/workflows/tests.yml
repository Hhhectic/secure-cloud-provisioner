name: tests

# The offline suite needs no AWS account and no credentials: moto stands in
# for the API and scanner/ has no cloud calls in it at all. That is what makes
# it safe to run on every push from a fork, and it is the reason the rules were
# kept free of boto3 in the first place.
#
# What this cannot check is whether the tool works. Several things in this
# project were correct against moto and wrong against AWS, and the list of them
# is in CLAUDE.md. scripts/smoke_test.py is the answer to that question and it
# needs a real account, so it is deliberately not run here.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      # The frontend tests run under Node, which the runner already has along
      # with ssh-keygen. jsdom is the one thing that needs fetching, and it is
      # a devDependency: the page itself ships no dependencies at all.
      #
      # Both suites skip themselves when their tools are missing, so leaving
      # this step out would turn a real failure into a silent skip.
      - name: Install the frontend test tooling
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Confirm the frontend tests are not silently skipping
        working-directory: backend
        run: pytest tests/test_frontend_keygen.py -q --no-header -rs
          && test -d ../frontend/node_modules/jsdom

      - name: Run the offline suite
        working-directory: backend
        # Deliberately fake credentials rather than none.
        #
        # A runner has no account today, so a plain run would prove the same
        # thing - but the moment somebody adds real AWS secrets to this
        # repository for another workflow, a test that reached past moto would
        # start touching a live account and still show a green tick. These
        # values are moto's own convention and cannot authenticate anywhere.
        #
        # Setting them empty instead of fake does not work: botocore treats an
        # empty string as a credential and fails differently from having none.
        env:
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
          AWS_SESSION_TOKEN: testing
          AWS_DEFAULT_REGION: us-east-1
        run: pytest -q

      - name: Run the Azure half's own suite
        # Added when the two halves were merged. CI ran only backend/ before
        # that, so azure_scanner's six tests had never run here at all - a
        # green tick meant half the repository was tested.
        #
        # Run from the root because that is where those modules live, and
        # without installing the Azure SDK: test_azure_scanner.py exercises
        # the rule logic, which touches no cloud. If it ever needs the SDK,
        # that is a sign a rule has grown a dependency it should not have.
        run: pytest test_azure_scanner.py -q
